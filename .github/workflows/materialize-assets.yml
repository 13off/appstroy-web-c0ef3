name: Materialize image assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-assets.mjs'
      - 'asset-data-v4/**'
      - 'chunks/hotel-*.js'
      - '.github/workflows/materialize-assets.yml'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create WebP files
        run: node scripts/materialize-assets.mjs

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.webp assets/room.webp assets/hotel.webp
          if git diff --cached --quiet; then
            echo "Изображения уже актуальны"
            exit 0
          fi
          git commit -m "Сохранить фотографии обычными WebP"
          git push
